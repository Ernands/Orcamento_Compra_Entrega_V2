name: Apply finance filtered summaries

on:
  push:
    branches:
      - feature/purchases-paid-total-visual

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/purchases-paid-total-visual
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply finance filter and payment-link changes
        run: python .github/scripts/adjust-finance-filtered-summaries.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/finance-payments-page.tsx src/pages/finance-payments-page.css src/pages/finance-store-detail-page.tsx src/pages/finance-store-detail-page.css src/tests/finance-payments-filtered-summary.test.ts src/tests/finance-store-detail-heading.test.ts
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: refletir filtros nos pagamentos financeiros"
          git push origin HEAD:feature/purchases-paid-total-visual
