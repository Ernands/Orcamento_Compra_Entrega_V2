name: Apply purchases paid total visual

on:
  push:
    branches:
      - feature/purchases-paid-total-visual

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/purchases-paid-total-visual
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply purchases card changes
        run: python .github/scripts/adjust-purchases-card-visual.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/supply-purchases-page.tsx src/pages/supply-purchases-v2.css src/tests/supply-purchases-page.test.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: destacar total pago e detalhar frete nas compras"
          git push origin HEAD:feature/purchases-paid-total-visual
