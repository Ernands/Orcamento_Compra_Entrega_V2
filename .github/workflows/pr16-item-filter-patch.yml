name: PR16 item filter patch

on:
  push:
    branches:
      - validation/quote-summary-prospector-grouping

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: validation/quote-summary-prospector-grouping
          fetch-depth: 0
      - name: Patch pages
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: esperado 1 trecho, encontrado {count}')
              return text.replace(old, new, 1)

          quotes_path = Path('src/pages/supply-quotes-page.tsx')
          purchases_path = Path('src/pages/supply-purchases-page.tsx')
          quotes = quotes_path.read_text(encoding='utf-8')
          purchases = purchases_path.read_text(encoding='utf-8')

          marker = "import { ItemMultiFilter, matchesSelectedItems, type ItemFilterOption } from '../components/item-multi-filter';"
          if marker in quotes and marker in purchases:
              print('Pages already patched.')
              raise SystemExit(0)

          quotes = replace_once(
              quotes,
              "import { QuoteSummaryModal } from '../components/quote-summary-modal';\n",
              "import { QuoteSummaryModal } from '../components/quote-summary-modal';\nimport { ItemMultiFilter, matchesSelectedItems, type ItemFilterOption } from '../components/item-multi-filter';\n",
              'quotes import',
          )
          quotes = replace_once(
              quotes,
              "  const [area, setArea] = useState('');\n  const [priceFilter, setPriceFilter] = useState<'all' | 'lowest'>('all');",
              "  const [area, setArea] = useState('');\n  const [itemFilterIds, setItemFilterIds] = useState<string[]>([]);\n  const [priceFilter, setPriceFilter] = useState<'all' | 'lowest'>('all');",
              'quotes state',
          )
          quote_options_anchor = """  const areas = useMemo(
    () =>
      [...new Set(items.map((item) => item.areaName).filter((value): value is string => Boolean(value)))]
        .sort((a, b) => a.localeCompare(b, 'pt-BR')),
    [items],
  );

  const baseFiltered = useMemo(() => {"""
          quote_options_new = """  const areas = useMemo(
    () =>
      [...new Set(items.map((item) => item.areaName).filter((value): value is string => Boolean(value)))]
        .sort((a, b) => a.localeCompare(b, 'pt-BR')),
    [items],
  );
  const quoteItemOptions = useMemo<ItemFilterOption[]>(() => {
    const options = new Map<string, ItemFilterOption>();
    quotes.forEach((quote) => quote.items.forEach((item) => {
      if (!options.has(item.supplyItemId)) {
        options.set(item.supplyItemId, {
          id: item.supplyItemId,
          code: item.itemCode,
          name: item.itemName,
        });
      }
    }));
    return [...options.values()].sort((a, b) =>
      `${a.code} ${a.name}`.localeCompare(`${b.code} ${b.name}`, 'pt-BR'),
    );
  }, [quotes]);

  const baseFiltered = useMemo(() => {"""
          quotes = replace_once(quotes, quote_options_anchor, quote_options_new, 'quotes options')
          quotes = replace_once(
              quotes,
              "        (!storeId || quote.stores.some((store) => store.id === storeId)) &&\n        ((!category && !area) ||",
              "        (!storeId || quote.stores.some((store) => store.id === storeId)) &&\n        matchesSelectedItems(quote.items.map((item) => item.supplyItemId), itemFilterIds) &&\n        ((!category && !area) ||",
              'quotes filter condition',
          )
          quotes = replace_once(
              quotes,
              "  }, [area, category, itemById, query, quotes, status, storeId]);",
              "  }, [area, category, itemById, itemFilterIds, query, quotes, status, storeId]);",
              'quotes filter deps',
          )
          quotes = replace_once(
              quotes,
              "        </label>\n        <select\n          aria-label=\"Filtrar status\"",
              "        </label>\n        <ItemMultiFilter\n          label=\"Filtrar itens em cotacoes\"\n          options={quoteItemOptions}\n          selectedIds={itemFilterIds}\n          onChange={setItemFilterIds}\n        />\n        <select\n          aria-label=\"Filtrar status\"",
              'quotes filter ui',
          )
          quotes_path.write_text(quotes, encoding='utf-8')

          purchases = replace_once(
              purchases,
              "import { EmptyState, ErrorState, IconButton, InlineLoading, Modal, StatusBadge } from '../components/ui';\n",
              "import { EmptyState, ErrorState, IconButton, InlineLoading, Modal, StatusBadge } from '../components/ui';\nimport { ItemMultiFilter, matchesSelectedItems, type ItemFilterOption } from '../components/item-multi-filter';\n",
              'purchases import',
          )
          purchases = replace_once(
              purchases,
              "  const [destinationFilter, setDestinationFilter] = useState('');\n  const [pendingFilter, setPendingFilter] = useState('');",
              "  const [destinationFilter, setDestinationFilter] = useState('');\n  const [itemFilterIds, setItemFilterIds] = useState<string[]>([]);\n  const [pendingFilter, setPendingFilter] = useState('');",
              'purchases state',
          )
          purchases = replace_once(
              purchases,
              "  const destinationLabels = useMemo(() => [...new Set(purchases.flatMap((purchase)=>purchase.items.flatMap((item)=>item.destinations.map((destination)=>destination.label))))].sort((a,b)=>a.localeCompare(b,'pt-BR')), [purchases]);\n\n  const filtered = useMemo(() => {",
              "  const destinationLabels = useMemo(() => [...new Set(purchases.flatMap((purchase)=>purchase.items.flatMap((item)=>item.destinations.map((destination)=>destination.label))))].sort((a,b)=>a.localeCompare(b,'pt-BR')), [purchases]);\n  const purchaseItemOptions = useMemo<ItemFilterOption[]>(() => {\n    const options = new Map<string, ItemFilterOption>();\n    purchases.forEach((purchase) => purchase.items.forEach((item) => {\n      if (!options.has(item.supplyItemId)) options.set(item.supplyItemId, { id: item.supplyItemId, code: item.itemCode, name: item.itemName });\n    }));\n    return [...options.values()].sort((a,b)=>`${a.code} ${a.name}`.localeCompare(`${b.code} ${b.name}`,'pt-BR'));\n  }, [purchases]);\n\n  const filtered = useMemo(() => {",
              'purchases options',
          )
          purchases = replace_once(
              purchases,
              "      if (status && purchase.status !== status) return false;\n      if (stateFilter",
              "      if (status && purchase.status !== status) return false;\n      if (!matchesSelectedItems(purchase.items.map((item)=>item.supplyItemId), itemFilterIds)) return false;\n      if (stateFilter",
              'purchases filter condition',
          )
          purchases = replace_once(
              purchases,
              "  }, [purchases,query,status,stateFilter,destinationFilter,pendingFilter]);",
              "  }, [purchases,query,status,stateFilter,destinationFilter,itemFilterIds,pendingFilter]);",
              'purchases filter deps',
          )
          purchases = replace_once(
              purchases,
              "    <div className=\"filter-bar purchase-v2-filters\"><label className=\"search-field\"><Search size={18}/><input placeholder=\"Buscar compra, cotacao, fornecedor, item ou destino\" value={query} onChange={(event)=>setQuery(event.target.value)}/></label><select aria-label=\"Status da compra\"",
              "    <div className=\"filter-bar purchase-v2-filters\"><label className=\"search-field\"><Search size={18}/><input placeholder=\"Buscar compra, cotacao, fornecedor, item ou destino\" value={query} onChange={(event)=>setQuery(event.target.value)}/></label><ItemMultiFilter label=\"Filtrar itens em compras\" options={purchaseItemOptions} selectedIds={itemFilterIds} onChange={setItemFilterIds}/><select aria-label=\"Status da compra\"",
              'purchases filter ui',
          )
          purchases_path.write_text(purchases, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/supply-quotes-page.tsx src/pages/supply-purchases-page.tsx
          git commit -m "feat: filtra cotacoes e compras por multiplos itens"
          git push origin HEAD:validation/quote-summary-prospector-grouping
