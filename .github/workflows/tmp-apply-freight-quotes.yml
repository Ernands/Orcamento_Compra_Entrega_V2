name: Temporary apply freight quotes UI

on:
  push:
    branches: [feat/freight-destinations-comparison]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[apply-freight-quotes-ui]') && !contains(github.event.head_commit.message, '[freight-test-diagnostic]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/freight-destinations-comparison
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply quotes UI patch
        run: python3 scripts/apply-freight-quotes-page.py
      - name: Run tests and capture diagnostics
        id: tests
        shell: bash
        run: |
          set +e
          npm test -- --run > tmp-freight-test-output.log 2>&1
          status=$?
          set -e
          echo "status=$status" >> "$GITHUB_OUTPUT"
          cat tmp-freight-test-output.log
          exit 0
      - name: Persist failed test diagnostics
        if: steps.tests.outputs.status != '0'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-freight-test-output.log
          git commit -m "chore: capture freight test failure [freight-test-diagnostic]"
          git push origin HEAD:feat/freight-destinations-comparison
          exit 1
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Commit validated patch
        run: |
          rm -f tmp-freight-test-output.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/supply-quotes-page.tsx
          git commit -m "feat: integrar destinos de frete nas cotacoes [apply-freight-quotes-ui]" || exit 0
          git push origin HEAD:feat/freight-destinations-comparison
