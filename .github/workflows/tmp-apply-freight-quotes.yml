name: Temporary apply freight quotes UI

on:
  push:
    branches: [feat/freight-destinations-comparison]

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[apply-freight-quotes-ui]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/freight-destinations-comparison
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply quotes UI patch
        run: python3 scripts/apply-freight-quotes-page.py
      - run: npm test -- --run
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/supply-quotes-page.tsx
          git commit -m "feat: integrar destinos de frete nas cotacoes [apply-freight-quotes-ui]" || exit 0
          git push origin HEAD:feat/freight-destinations-comparison
