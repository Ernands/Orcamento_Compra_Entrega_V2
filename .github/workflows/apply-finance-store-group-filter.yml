name: Apply finance store group filter

on:
  push:
    branches:
      - feature/finance-store-group-filter
    paths:
      - scripts/apply-finance-store-group-filter.mjs
      - .github/workflows/apply-finance-store-group-filter.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/finance-store-group-filter
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source changes
        run: node scripts/apply-finance-store-group-filter.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/finance-store-detail-page.tsx src/tests/finance-store-group-filter.test.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: filtrar detalhe da loja por grupo"
          git push origin HEAD:feature/finance-store-group-filter
