name: Fix batch purchase enhancements
on:
  push:
    branches: [feature/batch-purchase-multiple-files-freight]
    paths: [scripts/fix-batch-purchase-enhancements.mjs]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/batch-purchase-multiple-files-freight
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fix-batch-purchase-enhancements.mjs
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/supply-purchases-page.tsx
          git commit -m "fix: reset e valores dos anexos multiplos"
          git push
