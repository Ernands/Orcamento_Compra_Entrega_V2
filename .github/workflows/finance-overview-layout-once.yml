name: Finance overview layout once

on:
  push:
    branches:
      - feature/finance-overview-equipment-furniture

permissions:
  contents: write

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/finance-overview-equipment-furniture
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply layout adjustments
        run: |
          node scripts/repair-finance-overview-layout-script.mjs
          node scripts/repair-finance-overview-layout-test.mjs
          node scripts/adjust-finance-overview-layout.mjs
      - name: Commit adjusted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/finance-page.tsx src/pages/finance-page.css src/data/exports/finance-exports.ts src/tests/finance-exports.test.ts
          git diff --cached --quiet && exit 1
          git commit -m "feat: recolher financeiro e corrigir cores da visão geral"
          git push origin HEAD:feature/finance-overview-equipment-furniture
