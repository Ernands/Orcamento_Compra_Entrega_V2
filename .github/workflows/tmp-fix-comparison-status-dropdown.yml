name: Temporary comparison status dropdown fix

on:
  push:
    branches: [fix/comparativo-status-dropdown]

permissions:
  contents: write

jobs:
  apply-fix:
    if: ${{ !contains(github.event.head_commit.message, '[status-dropdown-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/comparativo-status-dropdown
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply source and test changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/pages/supply-comparison-page.tsx')
          text = page.read_text()

          old_import = "import { useCallback, useEffect, useMemo, useState } from 'react';"
          new_import = "import { useCallback, useEffect, useMemo, useRef, useState } from 'react';"
          if old_import not in text:
              raise SystemExit('React import anchor not found')
          text = text.replace(old_import, new_import, 1)

          old_state = "  const [statuses, setStatuses] = useState<SupplyQuoteStatus[]>(['received']);\n"
          new_state = (
              "  const [statuses, setStatuses] = useState<SupplyQuoteStatus[]>(['received']);\n"
              "  const [statusMenuOpen, setStatusMenuOpen] = useState(false);\n"
              "  const statusFilterRef = useRef<HTMLDetailsElement>(null);\n"
          )
          if old_state not in text:
              raise SystemExit('Status state anchor not found')
          text = text.replace(old_state, new_state, 1)

          old_load_effect = "  useEffect(() => {\n    void load();\n  }, [load]);\n"
          new_load_effect = old_load_effect + """  useEffect(() => {
    if (!statusMenuOpen) return;

    const handleMouseDown = (event: MouseEvent) => {
      const target = event.target;
      if (target instanceof Node && !statusFilterRef.current?.contains(target)) {
        setStatusMenuOpen(false);
      }
    };
    const handleKeyDown = (event: KeyboardEvent) => {
      if (event.key !== 'Escape') return;
      setStatusMenuOpen(false);
      const summary = statusFilterRef.current?.querySelector('summary');
      if (summary instanceof HTMLElement) summary.focus();
    };

    document.addEventListener('mousedown', handleMouseDown);
    document.addEventListener('keydown', handleKeyDown);
    return () => {
      document.removeEventListener('mousedown', handleMouseDown);
      document.removeEventListener('keydown', handleKeyDown);
    };
  }, [statusMenuOpen]);
"""
          if text.count(old_load_effect) != 1:
              raise SystemExit(f'Expected one load effect anchor, found {text.count(old_load_effect)}')
          text = text.replace(old_load_effect, new_load_effect, 1)

          old_details = '        <details className="comparison-status-filter">\n'
          new_details = """        <details
          ref={statusFilterRef}
          className="comparison-status-filter"
          open={statusMenuOpen}
          onToggle={(event) => setStatusMenuOpen(event.currentTarget.open)}
        >
"""
          if old_details not in text:
              raise SystemExit('Details anchor not found')
          text = text.replace(old_details, new_details, 1)

          old_received = """              <button type="button" onClick={() => setStatuses(['received'])}>
                Somente recebidas
              </button>
"""
          new_received = """              <button
                type="button"
                onClick={() => {
                  setStatuses(['received']);
                  setStatusMenuOpen(false);
                }}
              >
                Somente recebidas
              </button>
"""
          if old_received not in text:
              raise SystemExit('Received shortcut anchor not found')
          text = text.replace(old_received, new_received, 1)

          old_all = """              <button type="button" onClick={() => setStatuses([...COMPARISON_STATUS_OPTIONS])}>
                Todos
              </button>
"""
          new_all = """              <button
                type="button"
                onClick={() => {
                  setStatuses([...COMPARISON_STATUS_OPTIONS]);
                  setStatusMenuOpen(false);
                }}
              >
                Todos
              </button>
"""
          if old_all not in text:
              raise SystemExit('All shortcut anchor not found')
          text = text.replace(old_all, new_all, 1)
          page.write_text(text)

          test = Path('src/tests/supply-comparison-page.test.tsx')
          text = test.read_text()
          addition = r'''

  it('fecha o seletor de status ao clicar fora, usar atalho ou pressionar Escape', async () => {
    const user = userEvent.setup();
    render(<SupplyComparisonPage />);
    await screen.findByText('Fornecedor Local');

    const summary = screen.getByLabelText('Filtrar status no comparativo');
    const details = summary.closest('details');
    expect(details).not.toBeNull();

    await user.click(summary);
    expect(details).toHaveAttribute('open');

    await user.click(screen.getByLabelText('Filtrar item no comparativo'));
    expect(details).not.toHaveAttribute('open');

    await user.click(summary);
    expect(details).toHaveAttribute('open');
    await user.keyboard('{Escape}');
    expect(details).not.toHaveAttribute('open');

    await user.click(summary);
    expect(details).toHaveAttribute('open');
    await user.click(screen.getByRole('button', { name: 'Todos' }));
    expect(details).not.toHaveAttribute('open');
  });
'''
          marker = '\n});\n'
          if not text.endswith(marker):
              raise SystemExit('Test file closing marker not found')
          text = text[:-len(marker)] + addition + marker
          test.write_text(text)
          PY
      - name: Validate focused tests
        run: npm ci && npm test -- src/tests/supply-comparison-page.test.tsx
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/supply-comparison-page.tsx src/tests/supply-comparison-page.test.tsx
          git commit -m "fix: fechar filtro de status do comparativo [status-dropdown-fix]"
          git push origin HEAD:fix/comparativo-status-dropdown
