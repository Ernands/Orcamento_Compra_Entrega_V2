name: Apply paid purchase green accent

on:
  push:
    branches:
      - feature/purchases-paid-total-visual

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/purchases-paid-total-visual
          fetch-depth: 0
      - name: Darken paid purchase side accent
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/pages/supply-purchases-v2.css')
          text = path.read_text(encoding='utf-8')
          old = ".purchase-v2-card.is-realized {\n  border-color: #9fd7b3;\n  box-shadow: inset 6px 0 0 #16a34a;\n}"
          new = ".purchase-v2-card.is-realized {\n  border-color: #9fd7b3;\n  border-left-width: 7px;\n  border-left-color: #087a36;\n  box-shadow: inset 3px 0 0 #087a36;\n}"
          if old not in text:
              raise SystemExit('realized card style not found')
          text = text.replace(old, new, 1)
          text = text.replace('.purchase-v2-card--purchased { border-left-color: #16a34a; }', '.purchase-v2-card--purchased { border-left-color: #087a36; }', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/supply-purchases-v2.css
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "style: escurecer destaque lateral de compras pagas"
          git push origin HEAD:feature/purchases-paid-total-visual
