name: Apply pending adjustments

on:
  push:
    branches:
      - feat/ajustes-cotacoes-comparativo-ui
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[pending-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply prepared patches
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def apply_patch(patch_path: Path) -> None:
              lines = patch_path.read_text().splitlines(keepends=True)
              i = 0
              current_path = None
              cursor = 0
              while i < len(lines):
                  line = lines[i]
                  if line.startswith('diff --git '):
                      parts = line.strip().split()
                      current_path = parts[3][2:]
                      cursor = 0
                      i += 1
                      continue
                  if line.startswith('--- ') or line.startswith('+++ '):
                      i += 1
                      continue
                  if line.strip() == '@@':
                      if current_path is None:
                          raise RuntimeError(f'{patch_path}: hunk without file')
                      i += 1
                      old_lines = []
                      new_lines = []
                      while i < len(lines):
                          hline = lines[i]
                          if hline.startswith('diff --git ') or hline.strip() == '@@':
                              break
                          if hline.startswith('+'):
                              new_lines.append(hline[1:])
                          elif hline.startswith('-'):
                              old_lines.append(hline[1:])
                          elif hline.startswith(' '):
                              old_lines.append(hline[1:])
                              new_lines.append(hline[1:])
                          elif hline.strip() == '':
                              old_lines.append(hline)
                              new_lines.append(hline)
                          else:
                              raise RuntimeError(
                                  f'{patch_path}: unexpected hunk line for {current_path}: {hline!r}'
                              )
                          i += 1

                      target = Path(current_path)
                      original = target.read_text()
                      old = ''.join(old_lines)
                      new = ''.join(new_lines)
                      if not old:
                          raise RuntimeError(f'{patch_path}: hunk without anchor in {current_path}')

                      index = original.find(old, cursor)
                      if index < 0:
                          index = original.find(old)
                      if index < 0:
                          raise RuntimeError(
                              f'{patch_path}: context not found in {current_path}: {old[:240]!r}'
                          )

                      updated = original[:index] + new + original[index + len(old):]
                      target.write_text(updated)
                      cursor = index + len(new)
                      continue
                  i += 1

          for patch in sorted(Path('.pending').glob('*.patch')):
              print(f'Applying {patch}')
              apply_patch(patch)
          PY

      - name: Remove temporary patch machinery
        shell: bash
        run: |
          rm -rf .pending
          rm -f .github/workflows/apply-pending-adjustments.yml

      - name: Commit applied package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Aplica melhorias acumuladas de cotacoes e comparativo [pending-applied]"
          git push origin HEAD:feat/ajustes-cotacoes-comparativo-ui
