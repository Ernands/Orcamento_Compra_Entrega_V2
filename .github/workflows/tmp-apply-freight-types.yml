name: Temporary apply freight types

on:
  push:
    branches: [feat/freight-destinations-comparison]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[apply-freight-types]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/freight-destinations-comparison
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: python3 scripts/apply-freight-types-repository.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/types.ts src/data/supplies/supplies-repository.ts
          git commit -m "feat: integrar tipos e leitura de destinos [apply-freight-types]" || exit 0
          git push origin HEAD:feat/freight-destinations-comparison
