name: Fix purchases paid total test

on:
  push:
    branches:
      - feature/purchases-paid-total-visual

permissions:
  contents: write

jobs:
  patch-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/purchases-paid-total-visual
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix stale test expectation
        run: python .github/scripts/fix-purchases-paid-total-test.py
      - name: Commit test fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/tests/supply-purchases-page.test.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "test: atualizar expectativa para total pago"
          git push origin HEAD:feature/purchases-paid-total-visual
