name: Apply purchases compact cards

on:
  push:
    branches:
      - hotfix/purchases-store-filter

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/purchases-store-filter
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply compact cards fix
        run: python .github/scripts/apply-purchases-compact-cards.py
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/supply-purchases-page.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "ui: compactar compras recolhidas"
          git push origin HEAD:hotfix/purchases-store-filter
