name: Apply returned purchases visibility filter

on:
  push:
    branches:
      - feature/batch-purchase-multiple-files-freight

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/batch-purchase-multiple-files-freight
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch purchases filter
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/supply-purchases-page.tsx')
          text = path.read_text()

          replacements = [
              (
                  "  const [pendingFilter, setPendingFilter] = useState('');\n",
                  "  const [pendingFilter, setPendingFilter] = useState('');\n  const [hideReturned, setHideReturned] = useState(false);\n",
              ),
              (
                  "      if (search && !text.includes(search)) return false;\n      if (status && purchase.status !== status) return false;\n",
                  "      if (search && !text.includes(search)) return false;\n      if (hideReturned && purchase.status === 'returned') return false;\n      if (status && purchase.status !== status) return false;\n",
              ),
              (
                  "  }, [purchases,query,status,stateFilter,destinationFilter,itemFilterIds,pendingFilter,referenceFilter]);\n",
                  "  }, [purchases,query,status,stateFilter,destinationFilter,itemFilterIds,pendingFilter,referenceFilter,hideReturned]);\n",
              ),
              (
                  "<ItemMultiFilter label=\"Filtrar itens em compras\" options={purchaseItemOptions} selectedIds={itemFilterIds} onChange={setItemFilterIds}/><select aria-label=\"Status da compra\"",
                  "<ItemMultiFilter label=\"Filtrar itens em compras\" options={purchaseItemOptions} selectedIds={itemFilterIds} onChange={setItemFilterIds}/><label className=\"button button--secondary button--small\"><input type=\"checkbox\" checked={hideReturned} onChange={(event)=>setHideReturned(event.target.checked)}/>Omitir devolvidas para cotacao</label><select aria-label=\"Status da compra\"",
              ),
              (
                  "<option value=\"returned\">Devolvida</option>",
                  "<option value=\"returned\">Devolvida para cotacao</option>",
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old[:120]}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/supply-purchases-page.tsx
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: permitir omitir compras devolvidas para cotacao"
          git push origin HEAD:feature/batch-purchase-multiple-files-freight
