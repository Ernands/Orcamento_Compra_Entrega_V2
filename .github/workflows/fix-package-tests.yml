name: Fix package tests

on:
  push:
    branches:
      - feat/ajustes-cotacoes-comparativo-ui

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[ci-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ajustes-cotacoes-comparativo-ui
          fetch-depth: 0
      - name: Apply focused fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          page = Path('src/pages/supply-comparison-page.tsx')
          text = page.read_text()
          old = '<details className="comparison-status-filter">\n          <summary>'
          new = '<details className="comparison-status-filter">\n          <summary aria-label="Filtrar status no comparativo">'
          if old not in text:
              raise SystemExit('comparison summary anchor not found')
          page.write_text(text.replace(old, new, 1))

          test = Path('src/tests/supply-comparison-page.test.tsx')
          text = test.read_text()
          old = "    await user.click(screen.getByText('Recebida'));"
          new = "    await user.click(screen.getByLabelText('Filtrar status no comparativo'));"
          if old not in text:
              raise SystemExit('comparison test anchor not found')
          test.write_text(text.replace(old, new, 1))

          test = Path('src/tests/supply-quotes-page.test.tsx')
          text = test.read_text()
          old = "    expect(within(dialog).getByText(/Cancelada/)).toBeInTheDocument();"
          new = "    expect(within(dialog).getByText('Sem pesquisa · Cancelada · Todas as lojas')).toBeInTheDocument();"
          if old not in text:
              raise SystemExit('summary test anchor not found')
          test.write_text(text.replace(old, new, 1))
          PY
          rm -f .github/workflows/fix-package-tests.yml
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Ajusta seletores dos testes do pacote [ci-fix]"
          git push origin HEAD:feat/ajustes-cotacoes-comparativo-ui
