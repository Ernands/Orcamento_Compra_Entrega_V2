name: Apply batch purchase enhancements

on:
  push:
    branches:
      - feature/batch-purchase-multiple-files-freight
    paths:
      - scripts/apply-batch-purchase-enhancements.mjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/batch-purchase-multiple-files-freight
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: node scripts/apply-batch-purchase-enhancements.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/supply-purchases-page.tsx
          git commit -m "feat: arquivos multiplos e frete total na compra em lote"
          git push
